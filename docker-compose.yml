# One command to run the whole demo:  docker compose up --build
#
#   • API  →  http://localhost:8000  (FastAPI; /docs for the OpenAPI UI)
#   • UI   →  http://localhost:3000  (Next.js inspector)
#
# Provider (sprint §13): set in a .env file next to this file (see docs/setup-*.md).
#   • OpenAI:    ABA_PROVIDER=openai   + OPENAI_API_KEY
#   • Anthropic: ABA_PROVIDER=anthropic + ANTHROPIC_API_KEY
#   • Local:     ABA_PROVIDER=ollama   + run Ollama ON THE HOST (`ollama serve`,
#                `ollama pull qwen2.5:7b-instruct`). The container reaches it via
#                ABA_OLLAMA_URL=http://host.docker.internal:11434 (default below).
# Without a key/provider the app runs in deterministic OFFLINE mode (still fully traceable).
#
# Optional production swaps:
#   • True BGE-M3 multilingual embeddings:  build arg INSTALL_ML=true (see Dockerfile)
#   • Qdrant vector store:  `docker compose --profile qdrant up` + ABA_VECTOR_BACKEND=qdrant

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "false"
    ports:
      - "8000:8000"
    environment:
      # Provider (sprint §13). ABA_PROVIDER=openai|ollama|anthropic; legacy var still honored.
      ABA_PROVIDER: ${ABA_PROVIDER:-}
      ABA_LLM_PROVIDER: ${ABA_LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ABA_OPENAI_BASE_URL: ${ABA_OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Local Ollama on the HOST: default to the host gateway so the container can reach it
      # (Docker Desktop resolves host.docker.internal; Linux uses the extra_hosts mapping).
      ABA_OLLAMA_URL: ${ABA_OLLAMA_URL:-http://host.docker.internal:11434}
      ABA_OLLAMA_MODEL: ${ABA_OLLAMA_MODEL:-qwen2.5:7b-instruct}
      ABA_OFFLINE_MODE: ${ABA_OFFLINE_MODE:-auto}
      # Empty → resolved from the provider (anthropic→Claude, openai→gpt-4o, ollama→qwen2.5).
      ABA_MODEL_GENERATION: ${ABA_MODEL_GENERATION:-}
      ABA_MODEL_ROUTER: ${ABA_MODEL_ROUTER:-}
      ABA_MODEL_SQL: ${ABA_MODEL_SQL:-}
      ABA_EMBEDDING_BACKEND: ${ABA_EMBEDDING_BACKEND:-auto}
      ABA_EMBEDDING_DEVICE: ${ABA_EMBEDDING_DEVICE:-}
      ABA_VECTOR_BACKEND: ${ABA_VECTOR_BACKEND:-numpy}
      ABA_QDRANT_URL: http://qdrant:6333
    extra_hosts:
      # lets the container reach an Ollama running on the host (native Linux)
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist the embedding + LLM-response cache across restarts so the engine
      # warms up instantly (no re-embedding the corpus on every (re)start).
      - aba_cache:/app/data/cache
      # Persist a UI provider switch (sprint §14) so it survives a container restart —
      # without this volume the override is reload-safe but not restart-safe in Docker.
      - aba_runtime:/app/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # The Next server proxies /api/* to the API service (single public origin, no CORS).
        API_PROXY_TARGET: http://api:8000
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"

  # Public access for a live customer evaluation. Opt-in:
  #   docker compose --profile tunnel up -d
  # Then read the public URL from the tunnel's logs:
  #   docker compose logs tunnel | grep trycloudflare.com
  # The tunnel reaches the UI on the compose network (ui:3000); the UI proxies /api/*
  # to the API, so the whole app is served through one HTTPS origin (no CORS, no key
  # in the browser). This is a Cloudflare *quick tunnel* — the URL is random per start.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://ui:3000
    depends_on:
      - ui
    restart: unless-stopped

volumes:
  aba_cache:
  aba_runtime:
